<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380">
  <defs>
    <style>
      .bg { fill:#0d1117; }
      .bar { fill:#161b22; }
      .dotr{ fill:#ff5f56; } .doty{ fill:#ffbd2e; } .dotg{ fill:#27c93f; }
      .prompt{ fill:#39d353; font:600 14px 'JetBrains Mono','Fira Code','SF Mono',monospace; }
      .cmd  { fill:#e6edf3; font:600 14px 'JetBrains Mono','Fira Code','SF Mono',monospace; }
      .out  { fill:#8b949e; font:400 14px 'JetBrains Mono','Fira Code','SF Mono',monospace; }
      .hdr  { fill:#58a6ff; font:600 14px 'JetBrains Mono','Fira Code','SF Mono',monospace; }
      .cur  { fill:#39d353; }
    </style>
    <linearGradient id="termGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- zsh window -->
  <rect class="bg" x="0" y="0" width="800" height="380" rx="12"/>
  <rect x="0" y="0" width="800" height="44" rx="12" fill="url(#termGrad)"/>
  <rect x="0" y="40" width="800" height="4" fill="#161b22"/>
  <circle class="dotr" cx="20" cy="22" r="7"/>
  <circle class="doty" cx="42" cy="22" r="7"/>
  <circle class="dotg" cx="64" cy="22" r="7"/>
  <text x="380" y="29" text-anchor="middle" fill="#8b949e" font="500 12px monospace">govindtank@main - zsh</text>

  <!-- Content area -->
  <g font-family="JetBrains Mono, Fira Code, SF Mono, monospace" font-size="14" fill="#e6edf3">

    <!-- Line 1: profile command -->
    <text class="prompt" x="24" y="74">$</text>
    <text class="cmd" x="44" y="74">govindtank --profile</text>

    <!-- Output: animated typing -->
    <text class="hdr" x="24" y="104" clip-path="url(#clip-name)">
      Govind Tank - Mobile Architect
    </text>
    <text class="out" x="24" y="128" clip-path="url(#clip-role)">
      Flutter - Android - Kotlin Multiplatform - Python - On-device AI
    </text>
    <text class="out" x="24" y="152" clip-path="url(#clip-ship)">
      50+ repos - 4 pub.dev packages - 2 Play Store apps - 3 live dashboards
    </text>

    <!-- Line 2: $ govindtank libs -->
    <text class="prompt" x="24" y="188">$</text>
    <text class="cmd" x="44" y="188">govindtank libs --active</text>

    <!-- Library cards (animated) -->
    <g transform="translate(24,200)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="184" height="120" rx="8" fill="#161b22" stroke="#30363d"/>
      <rect x="0" y="0" width="184" height="4" rx="8" fill="#22d3ee" clip-path="url(#clip-c1)"/>
      <text x="12" y="24" class="hdr" clip-path="url(#clip-t1)">country_mobile_validator</text>
      <text x="12" y="46" class="out" clip-path="url(#clip-t2)">v0.2.0 - pana 160/160</text>
      <text x="12" y="68" class="ok" clip-path="url(#clip-t3)">zero native deps</text>
      <text x="12" y="90" class="out" clip-path="url(#clip-t4)">libphonenumber metadata - mobile-only</text>
    </g>

    <g transform="translate(220,200)">
      <!-- Card 2 -->
      <rect x="0" y="0" width="184" height="120" rx="8" fill="#161b22" stroke="#30363d"/>
      <rect x="0" y="0" width="184" height="4" rx="8" fill="#39d353" clip-path="url(#clip-c2)"/>
      <text x="12" y="24" class="hdr" clip-path="url(#clip-t5)">flutter_whisper</text>
      <text x="12" y="46" class="out" clip-path="url(#clip-t6)">v0.1.0 - whisper.cpp bridge</text>
      <text x="12" y="68" class="ok" clip-path="url(#clip-t7)">offline - streaming - cancelable</text>
      <text x="12" y="90" class="out" clip-path="url(#clip-t8)">on-device STT - zero cloud cost</text>
    </g>

    <g transform="translate(416,200)">
      <!-- Card 3 -->
      <rect x="0" y="0" width="184" height="120" rx="8" fill="#161b22" stroke="#30363d"/>
      <rect x="0" y="0" width="184" height="4" rx="8" fill="#f778ba" clip-path="url(#clip-c3)"/>
      <text x="12" y="24" class="hdr" clip-path="url(#clip-t9)">waveform_pro</text>
      <text x="12" y="46" class="out" clip-path="url(#clip-t10)">v1.0.0 - GPU shader rasterizer</text>
      <text x="12" y="68" class="ok" clip-path="url(#clip-t11)">60fps zoom - markers - peaks</text>
      <text x="12" y="90" class="out" clip-path="url(#clip-t12)">CustomPaint - audio viz</text>
    </g>

    <g transform="translate(612,200)">
      <!-- Card 4 -->
      <rect x="0" y="0" width="184" height="120" rx="8" fill="#161b22" stroke="#30363d"/>
      <rect x="0" y="0" width="184" height="4" rx="8" fill="#d2a8ff" clip-path="url(#clip-c4)"/>
      <text x="12" y="24" class="hdr" clip-path="url(#clip-t13)">quote_painter</text>
      <text x="12" y="46" class="out" clip-path="url(#clip-t14)">v0.1.0 - text-on-canvas engine</text>
      <text x="12" y="68" class="ok" clip-path="url(#clip-t15)">gradient - stroke - shadow</text>
      <text x="12" y="90" class="out" clip-path="url(#clip-t16)">per-line alignment - export</text>
    </g>

    <!-- Line 3: $ govindtank automate -->
    <text class="prompt" x="24" y="340">$</text>
    <text class="cmd" x="44" y="340">govindtank automate --status</text>
    <text class="ok" x="24" y="364" clip-path="url(#clip-auto)">
      [OK] stock-scanner 4x/day IST  -  [OK] readme refresh 4x/day  -  [OK] snake regen 4x/day
    </text>

  </g>

  <!-- Animations: typing clips -->
  <defs>
    <clipPath id="clip-name"><rect x="24" y="84" width="0" height="24"><animate attributeName="width" from="0" to="360" dur="1.2s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-role"><rect x="24" y="108" width="0" height="24"><animate attributeName="width" from="0" to="520" dur="1.8s" begin="1.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-ship"><rect x="24" y="132" width="0" height="24"><animate attributeName="width" from="0" to="560" dur="1.8s" begin="3.6s" fill="freeze"/></rect></clipPath>

    <clipPath id="clip-c1"><rect x="0" y="0" width="0" height="4"><animate attributeName="width" from="0" to="184" dur="0.6s" begin="4.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-t1"><rect x="12" y="4" width="0" height="20"><animate attributeName="width" from="0" to="160" dur="0.8s" begin="4.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-t2"><rect x="12" y="26" width="0" height="22"><animate attributeName="width" from="0" to="140" dur="0.8s" begin="4.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-t3"><rect x="12" y="48" width="0" height="22"><animate attributeName="width" from="0" to="120" dur="0.8s" begin="5.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-t4"><rect x="12" y="70" width="0" height="20"><animate attributeName="width" from="0" to="150" dur="0.8s" begin="5.4s" fill="freeze"/></rect></clipPath>

    <clipPath id="clip-c2"><rect x="0" y="0" width="0" height="4"><animate attributeName="width" from="0" to="184" dur="0.6s" begin="5.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-t5"><rect x="12" y="4" width="0" height="20"><animate attributeName="width" from="0" to="140" dur="0.8s" begin="5.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-t6"><rect x="12" y="26" width="0" height="22"><animate attributeName="width" from="0" to="160" dur="0.8s" begin="5.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-t7"><rect x="12" y="48" width="0" height="22"><animate attributeName="width" from="0" to="170" dur="0.8s" begin="6.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-t8"><rect x="12" y="70" width="0" height="20"><animate attributeName="width" from="0" to="150" dur="0.8s" begin="6.4s" fill="freeze"/></rect></clipPath>

    <clipPath id="clip-c3"><rect x="0" y="0" width="0" height="4"><animate attributeName="width" from="0" to="184" dur="0.6s" begin="6.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-t9"><rect x="12" y="4" width="0" height="20"><animate attributeName="width" from="0" to="120" dur="0.8s" begin="6.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-t10"><rect x="12" y="26" width="0" height="22"><animate attributeName="width" from="0" to="170" dur="0.8s" begin="6.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-t11"><rect x="12" y="48" width="0" height="22"><animate attributeName="width" from="0" to="160" dur="0.8s" begin="7.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-t12"><rect x="12" y="70" width="0" height="20"><animate attributeName="width" from="0" to="130" dur="0.8s" begin="7.4s" fill="freeze"/></rect></clipPath>

    <clipPath id="clip-c4"><rect x="0" y="0" width="0" height="4"><animate attributeName="width" from="0" to="184" dur="0.6s" begin="7.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-t13"><rect x="12" y="4" width="0" height="20"><animate attributeName="width" from="0" to="120" dur="0.8s" begin="7.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-t14"><rect x="12" y="26" width="0" height="22"><animate attributeName="width" from="0" to="180" dur="0.8s" begin="7.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-t15"><rect x="12" y="48" width="0" height="22"><animate attributeName="width" from="0" to="140" dur="0.8s" begin="8.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-t16"><rect x="12" y="70" width="0" height="20"><animate attributeName="width" from="0" to="150" dur="0.8s" begin="8.4s" fill="freeze"/></rect></clipPath>

    <clipPath id="clip-auto"><rect x="24" y="344" width="0" height="20"><animate attributeName="width" from="0" to="600" dur="1.5s" begin="9.0s" fill="freeze"/></rect></clipPath>

    <!-- Blinking cursor -->
    <animate id="cursor" attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </defs>

  <!-- Cursor -->
  <rect class="cur" x="320" y="340" width="10" height="20" rx="1">
    <animate href="#cursor" attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

</svg>